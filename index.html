<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Glitch Effect</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes jitter {
      0% { transform: translate(0, 0) skew(0deg); }
      10% { transform: translate(calc(-3px * var(--intensity, 1)), calc(2px * var(--intensity, 1))) skew(calc(-1deg * var(--intensity, 1))); }
      20% { transform: translate(calc(3px * var(--intensity, 1)), calc(-2px * var(--intensity, 1))) skew(calc(2deg * var(--intensity, 1))); }
      30% { transform: translate(calc(-4px * var(--intensity, 1)), calc(-1px * var(--intensity, 1))) skew(0deg); }
      40% { transform: translate(calc(2px * var(--intensity, 1)), calc(3px * var(--intensity, 1))) skew(calc(1deg * var(--intensity, 1))); }
      50% { transform: translate(calc(-2px * var(--intensity, 1)), calc(1px * var(--intensity, 1))) skew(calc(-2deg * var(--intensity, 1))); }
      60% { transform: translate(calc(3px * var(--intensity, 1)), calc(-1px * var(--intensity, 1))) skew(0deg); }
      70% { transform: translate(calc(-1px * var(--intensity, 1)), calc(2px * var(--intensity, 1))) skew(calc(1deg * var(--intensity, 1))); }
      80% { transform: translate(calc(2px * var(--intensity, 1)), calc(-2px * var(--intensity, 1))) skew(calc(-1deg * var(--intensity, 1))); }
      90% { transform: translate(calc(-2px * var(--intensity, 1)), calc(1px * var(--intensity, 1))) skew(0deg); }
      100% { transform: translate(0, 0) skew(0deg); }
    }

    @keyframes glitch-slice-1 {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); }
      15% { clip-path: inset(20% 0 50% 0); transform: translate(-8px, 2px); }
      35% { clip-path: inset(60% 0 10% 0); transform: translate(7px, -3px); }
      55% { clip-path: inset(10% 0 70% 0); transform: translate(-6px, 1px); }
      75% { clip-path: inset(40% 0 30% 0); transform: translate(5px, 3px); }
      90% { clip-path: inset(80% 0 5% 0); transform: translate(-4px, -2px); }
    }

    @keyframes glitch-slice-2 {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); }
      20% { clip-path: inset(10% 0 65% 0); transform: translate(6px, -2px); }
      40% { clip-path: inset(70% 0 15% 0); transform: translate(-7px, 3px); }
      60% { clip-path: inset(30% 0 45% 0); transform: translate(8px, -1px); }
      80% { clip-path: inset(50% 0 25% 0); transform: translate(-5px, 2px); }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    .glitch-wrapper {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }

    .jitter-box {
      animation: jitter 0.12s infinite ease-in-out;
      transform-origin: center;
      will-change: transform;
    }

    .glitch-text {
      position: relative;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .glitch-text::before {
      color: #00f3ff;
      text-shadow: -3px 0 #00f3ff, 0 0 15px #00f3ff;
      animation: glitch-slice-1 0.35s infinite linear alternate-reverse;
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    .glitch-text::after {
      color: #ff0055;
      text-shadow: 3px 0 #ff0055, 0 0 15px #ff0055;
      animation: glitch-slice-2 0.28s infinite linear alternate-reverse;
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    .cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 128, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .shockwave {
      position: absolute;
      border-radius: 50%;
      border: 2px solid #00f3ff;
      animation: expand-wave 0.5s ease-out forwards;
      pointer-events: none;
    }

    @keyframes expand-wave {
      0% { width: 0; height: 0; opacity: 1; transform: translate(-50%, -50%) scale(0.2); }
      100% { width: 350px; height: 350px; opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body class="bg-[#05050d] text-white min-h-screen flex items-center justify-center p-4">
  <div class="relative w-full max-w-xl mx-auto bg-[#0a0a14] rounded-2xl border border-cyan-500/40 p-5 shadow-[0_0_35px_rgba(0,243,255,0.2)] cyber-grid overflow-hidden">
    
    <!-- Scanline effect -->
    <div class="absolute inset-0 pointer-events-none opacity-20 bg-gradient-to-b from-transparent via-cyan-400 to-transparent h-12 w-full animate-[scanline_3s_linear_infinite]"></div>

    <!-- Header / Status -->
    <div class="flex items-center justify-between border-b border-cyan-500/20 pb-3 mb-4">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="font-mono text-xs tracking-wider text-cyan-400 uppercase font-semibold">CYBER_CORE // LIVE</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="soundBtn" class="px-2.5 py-1 text-xs font-mono rounded border border-pink-500/50 text-pink-300 hover:bg-pink-500/20 transition-all flex items-center gap-1 cursor-pointer">
          <span id="soundIcon">🔊</span> <span id="soundLabel">Âm thanh: BẬT</span>
        </button>
      </div>
    </div>

    <!-- Main Interactive Glitch Display -->
    <div id="interactiveZone" class="relative py-10 flex flex-col items-center justify-center rounded-xl bg-black/40 border border-white/5 overflow-hidden transition-all duration-200">
      <canvas id="particleCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>

      <!-- Clickable & Hoverable Jitter Text -->
      <div id="jitterBox" class="jitter-box" style="--intensity: 1;">
        <div id="glitchTrigger" class="glitch-wrapper group">
          <h1 id="helloText" 
              class="glitch-text text-6xl sm:text-7xl font-black text-white drop-shadow-[0_0_25px_rgba(255,255,255,0.8)] tracking-widest cursor-pointer" 
              data-text="HELLO">
            HELLO
          </h1>
        </div>
      </div>

      <p class="mt-4 font-mono text-xs text-cyan-300/80 animate-pulse text-center">
        ⚡ Rê chuột để rung lắc • Click để nổ hạt glitch & âm thanh ⚡
      </p>
    </div>

    <!-- Interactive Control Panel -->
    <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3 border-t border-cyan-500/20 text-xs font-mono">
      <!-- Intensity Slider -->
      <div class="flex flex-col gap-1 bg-black/30 p-2.5 rounded-lg border border-cyan-500/20">
        <div class="flex justify-between text-cyan-300">
          <span>ĐỘ GIẬT GIẬT:</span>
          <span id="intensityVal" class="text-pink-400 font-bold">100%</span>
        </div>
        <input id="intensityRange" type="range" min="0" max="300" value="100" class="w-full accent-pink-500 cursor-pointer">
      </div>

      <!-- Color Palette Buttons -->
      <div class="flex flex-col gap-1 bg-black/30 p-2.5 rounded-lg border border-cyan-500/20">
        <span class="text-cyan-300 mb-0.5">BỘ MÀU BẮT MẮT:</span>
        <div class="flex gap-1.5">
          <button data-theme="cyber" class="theme-btn flex-1 py-1 rounded bg-cyan-950 border border-cyan-400 text-cyan-300 font-semibold hover:brightness-125 cursor-pointer">Neon</button>
          <button data-theme="toxic" class="theme-btn flex-1 py-1 rounded bg-emerald-950 border border-emerald-400 text-emerald-300 font-semibold hover:brightness-125 cursor-pointer">Toxic</button>
          <button data-theme="sunset" class="theme-btn flex-1 py-1 rounded bg-amber-950 border border-amber-400 text-amber-300 font-semibold hover:brightness-125 cursor-pointer">Sunset</button>
          <button data-theme="hyper" class="theme-btn flex-1 py-1 rounded bg-fuchsia-950 border border-fuchsia-400 text-fuchsia-300 font-semibold hover:brightness-125 cursor-pointer">Hyper</button>
        </div>
      </div>
    </div>

    <!-- Custom Text Input -->
    <div class="mt-3 flex gap-2">
      <input id="customTextInput" type="text" maxlength="15" value="HELLO" placeholder="Nhập chữ bạn muốn..." class="flex-1 bg-black/60 border border-cyan-500/40 rounded-lg px-3 py-1.5 font-mono text-xs text-white focus:outline-none focus:border-pink-500 placeholder-white/30">
      <button id="applyTextBtn" class="px-4 py-1.5 bg-gradient-to-r from-cyan-500 to-pink-500 hover:from-cyan-400 hover:to-pink-400 text-black font-bold font-mono text-xs rounded-lg transition-all active:scale-95 shadow-[0_0_15px_rgba(255,0,128,0.4)] cursor-pointer">
        ĐỔI CHỮ
      </button>
      <button id="hyperGlitchBtn" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white font-mono text-xs font-bold rounded-lg transition-all active:scale-95 animate-bounce cursor-pointer">
        GIẬT CỰC ĐẠI! 💥
      </button>
    </div>

  </div>

  <script>
    // Audio Context Setup (Web Audio API Synthesizer)
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playGlitchSound(frequency = 440, type = 'sawtooth') {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(frequency * (Math.random() > 0.5 ? 2.5 : 0.3), audioCtx.currentTime + 0.12);
        
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
      } catch (e) {
        // audio play failed or muted
      }
    }

    function playExplosionSound() {
      if (!soundEnabled) return;
      try {
        initAudio();
        const bufferSize = audioCtx.sampleRate * 0.18;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.18);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
      } catch (e) {}
    }

    // Canvas Particles
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 4 + 2;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.015;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }
      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.fillStyle = this.color;
        c.shadowColor = this.color;
        c.shadowBlur = 10;
        c.fillRect(this.x, this.y, this.size, this.size);
        c.restore();
      }
    }

    function createExplosion(x, y) {
      const colors = ['#00f3ff', '#ff007f', '#ffe600', '#ffffff', '#00ff88'];
      for (let i = 0; i < 40; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(x, y, color));
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // DOM Elements
    const jitterBox = document.getElementById('jitterBox');
    const glitchTrigger = document.getElementById('glitchTrigger');
    const helloText = document.getElementById('helloText');
    const intensityRange = document.getElementById('intensityRange');
    const intensityVal = document.getElementById('intensityVal');
    const interactiveZone = document.getElementById('interactiveZone');
    const soundBtn = document.getElementById('soundBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');
    const customTextInput = document.getElementById('customTextInput');
    const applyTextBtn = document.getElementById('applyTextBtn');
    const hyperGlitchBtn = document.getElementById('hyperGlitchBtn');

    // Intensity change
    intensityRange.addEventListener('input', (e) => {
      const val = e.target.value;
      const factor = val / 100;
      jitterBox.style.setProperty('--intensity', factor);
      intensityVal.textContent = val + '%';
      if (val > 0) {
        jitterBox.style.animationDuration = Math.max(0.04, 0.16 - (factor * 0.04)) + 's';
      }
    });

    // Hover & Mouse Interaction (Tilt & Speedup)
    interactiveZone.addEventListener('mousemove', (e) => {
      const rect = interactiveZone.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      
      const tiltX = (y / (rect.height / 2)) * -12;
      const tiltY = (x / (rect.width / 2)) * 12;
      
      helloText.style.transform = `perspective(500px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.04)`;

      if (Math.random() > 0.7) {
        particles.push(new Particle(e.clientX - rect.left, e.clientY - rect.top, '#00f3ff'));
      }
    });

    interactiveZone.addEventListener('mouseleave', () => {
      helloText.style.transform = 'perspective(500px) rotateX(0deg) rotateY(0deg) scale(1)';
    });

    // Click Shockwave & Blast
    glitchTrigger.addEventListener('click', (e) => {
      const rect = interactiveZone.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const wave = document.createElement('div');
      wave.className = 'shockwave';
      wave.style.left = clickX + 'px';
      wave.style.top = clickY + 'px';
      interactiveZone.appendChild(wave);
      setTimeout(() => wave.remove(), 550);

      createExplosion(clickX, clickY);

      playExplosionSound();
      playGlitchSound(880, 'sawtooth');

      jitterBox.style.setProperty('--intensity', '3.5');
      setTimeout(() => {
        jitterBox.style.setProperty('--intensity', intensityRange.value / 100);
      }, 350);
    });

    // Sound toggle
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        initAudio();
        soundIcon.textContent = '🔊';
        soundLabel.textContent = 'Âm thanh: BẬT';
        soundBtn.classList.remove('opacity-50');
      } else {
        soundIcon.textContent = '🔇';
        soundLabel.textContent = 'Âm thanh: TẮT';
        soundBtn.classList.add('opacity-50');
      }
    });

    // Color Theme switching
    const themes = {
      cyber: {
        text: '#ffffff',
        before: '#00f3ff',
        after: '#ff0055',
        shadow: 'rgba(0, 243, 255, 0.4)'
      },
      toxic: {
        text: '#adff2f',
        before: '#00ff66',
        after: '#ffee00',
        shadow: 'rgba(0, 255, 102, 0.4)'
      },
      sunset: {
        text: '#ffeaa7',
        before: '#ff7675',
        after: '#fdcb6e',
        shadow: 'rgba(255, 118, 117, 0.4)'
      },
      hyper: {
        text: '#ffffff',
        before: '#e056fd',
        after: '#686de0',
        shadow: 'rgba(224, 86, 253, 0.4)'
      }
    };

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const themeKey = btn.dataset.theme;
        const t = themes[themeKey];
        if (!t) return;
        
        helloText.style.color = t.text;
        
        let customStyle = document.getElementById('dynamic-theme-style');
        if (!customStyle) {
          customStyle = document.createElement('style');
          customStyle.id = 'dynamic-theme-style';
          document.head.appendChild(customStyle);
        }
        customStyle.innerHTML = `
          .glitch-text::before { color: ${t.before} !important; text-shadow: -3px 0 ${t.before}, 0 0 15px ${t.before} !important; }
          .glitch-text::after { color: ${t.after} !important; text-shadow: 3px 0 ${t.after}, 0 0 15px ${t.after} !important; }
        `;
        playGlitchSound(550, 'square');
      });
    });

    // Change Text
    function updateText() {
      const val = customTextInput.value.trim() || 'HELLO';
      helloText.textContent = val;
      helloText.setAttribute('data-text', val);
      playGlitchSound(700, 'sine');
    }

    applyTextBtn.addEventListener('click', updateText);
    customTextInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') updateText();
    });

    // Hyper Glitch trigger
    hyperGlitchBtn.addEventListener('click', () => {
      jitterBox.style.setProperty('--intensity', '5');
      jitterBox.style.animationDuration = '0.03s';
      playGlitchSound(1200, 'sawtooth');
      setTimeout(() => playGlitchSound(300, 'square'), 70);
      setTimeout(() => playGlitchSound(900, 'sawtooth'), 140);

      const rect = interactiveZone.getBoundingClientRect();
      createExplosion(rect.width / 2, rect.height / 2);

      setTimeout(() => {
        jitterBox.style.setProperty('--intensity', intensityRange.value / 100);
        jitterBox.style.animationDuration = '0.12s';
      }, 800);
    });
  </script>
</body>
</html>
